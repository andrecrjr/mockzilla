services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.landing
    # Explicit name so this build never overwrites the dev image (both are service `app`).
    image: mockzilla-landing:latest
    container_name: mockzilla-landing
    ports:
      - "36666:3000"
    env_file:
      - .env.landing
    networks:
      - mockzilla-dev-network

networks:
  mockzilla-dev-network:
    driver: bridge
